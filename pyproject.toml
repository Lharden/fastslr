[build-system]
# license = "MIT" (PEP 639) exige setuptools >= 77.0.3
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fastslr"
dynamic = ["version"]
description = "FastSLR - Universal deterministic triage for Systematic Literature Reviews"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Leonardo Harden", email = "leonardo.harden@pucpr.edu.br" },
]
maintainers = [
    { name = "Leonardo Harden", email = "leonardo.harden@pucpr.edu.br" },
]
requires-python = ">=3.10"
keywords = [
    "systematic-literature-review",
    "slr",
    "screening",
    "triage",
    "academic",
    "research",
    "deterministic",
    "bibliometrics",
]
# NOTE: no "License ::" classifier — forbidden alongside the PEP 639
# license expression above (setuptools >= 77 rejects the combination).
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "pyright>=1.1",
    "coverage>=7.0",
]
chardet = ["chardet>=5.0"]

[project.scripts]
fastslr = "fastslr.app.cli:main"

[project.urls]
Homepage = "https://github.com/Lharden/fastslr"
Repository = "https://github.com/Lharden/fastslr"
Documentation = "https://github.com/Lharden/fastslr/blob/master/docs/GUIA_DO_USUARIO.md"
Issues = "https://github.com/Lharden/fastslr/issues"
Changelog = "https://github.com/Lharden/fastslr/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "fastslr.core.constants.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastslr = ["py.typed", "i18n/locales/*.json", "core/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [
    "build",
    "dist",
    "teste",
    "**/__pycache__",
    "**/.ruff_cache",
    "**/.pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
